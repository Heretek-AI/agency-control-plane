name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23"
          cache: false

      - name: Install dependencies (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install nats-server (JetStream integration test)
        run: |
          go install github.com/nats-io/nats-server/v2@v2.10.24
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Chromium for the UI smoke test
        run: ./node_modules/.bin/playwright-core install --with-deps chromium

      - name: make check
        run: make check

      - name: make accept
        run: make accept

      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screenshot
          path: docs/evidence/ui.png
          if-no-files-found: ignore
